.pt{font-family:'Playfair Display',serif}

input,select,button{font-family:'Lato',sans-serif}

.header{background:linear-gradient(135deg,#3d2e1e,#5c4433);padding:28px 20px 20px;text-align:center;position:relative;overflow:hidden}
.header-bg{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 20% 50%,rgba(181,133,90,.22) 0%,transparent 60%),radial-gradient(circle at 80% 20%,rgba(181,133,90,.15) 0%,transparent 50%)}
.header-inner{position:relative}
.header h1{color:#faf7f2;font-size:32px;font-weight:400;margin-bottom:3px}
.header p{color:#c4a47a;font-size:15px;font-style:italic;margin-bottom:16px}
.header-stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.stat{text-align:center}
.stat-val{font-family:'Playfair Display',serif;color:#b5855a;font-size:20px;font-weight:700}
.stat-lbl{color:#a08060;font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.budget-note{background:#2e1e10;padding:8px 16px;text-align:center;color:#e8c898;font-size:12px;line-height:1.5}
/* CONTENT */
.content{max-width:860px;margin:0 auto;padding:20px 14px 40px}

.card{background:white;border:1px solid #e8d8c4;border-radius:8px;overflow:hidden;margin-bottom:14px}
.card-header{padding:12px 16px;background:#3d2e1e;color:#faf7f2;font-size:15px;font-weight:400}
.section-title{font-size:21px;font-weight:400;margin-bottom:4px}
.section-sub{color:#7a6355;font-size:13px;margin-bottom:18px}

.tbl-row:hover{background:rgba(181,133,90,.07)}
.tbl-foot{display:grid;padding:11px 13px;background:#3d2e1e}

.dot-ok{background:#6b8a70}
.dot-warn{background:#c17f3e}
.dot-note{background:#5a7ea8}

.prog-bar{height:100%;border-radius:3px;transition:width .4s}

.actual-inp:focus{border-color:#5a8a60;background:#f0f8f0}
.actual-wrap{position:relative;display:inline-flex;align-items:center}
.actual-prefix{position:absolute;left:7px;font-size:11px;color:#5a8a60;font-weight:700;pointer-events:none}
/* PILL */
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill-high{background:#fce8e8;color:#c0392b}
.pill-med{background:#fef3e2;color:#c17f3e}
.pill-low{background:#eef5ee;color:#5a8a60}

input[type=checkbox]{accent-color:#b5855a;width:16px;height:16px;cursor:pointer;flex-shrink:0}

.task-row:hover{background:rgba(181,133,90,.06)}
.task-row label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;width:100%}

.phase-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}

/* ADD ROW */
.add-row{padding:9px 14px;background:#faf7f2;border-top:1px dashed #e0d0c0;display:flex;gap:8px;align-items:center}
/* DAY TIMELINE */
.day-card{border-radius:8px;overflow:hidden;margin-bottom:16px;border-top:4px solid}
.day-event{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 16px;border-bottom:1px solid #f5ede0;align-items:start}
/* GRAND SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.summary-card{text-align:center;padding:12px 6px;background:rgba(255,255,255,.07);border-radius:6px}
/* SYNC BADGE */
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#7aaa7a;padding:4px 10px;background:rgba(122,170,122,.12);border-radius:20px;margin-bottom:16px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#7aaa7a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* MOBILE SCROLL */
.scr{max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scr::-webkit-scrollbar{width:4px}
.scr::-webkit-scrollbar-thumb{background:#d4b896;border-radius:3px}
/* EMPTY STATE */
.empty{text-align:center;padding:36px 20px;border:1px dashed #d4c4b0;border-radius:8px;color:#a08060}
/* OVER/UNDER */
.over{color:#e07070}
.under{color:#7aaa7a}

select{border:1px solid #d4c4b0;border-radius:5px;padding:7px 8px;font-size:12px;color:#3d2e1e;background:#faf7f2;outline:none}

const SYNC_KEY = "liz-ryan-wedding-2027";
let saveTimer = null;

async function loadFromCloud() {
  try {
    const result = await window.storage.get(SYNC_KEY, true);
    if (result && result.value) {
      const saved = JSON.parse(result.value);
      state.checkedTasks   = saved.checkedTasks  || {};
      state.checkedSweden  = saved.checkedSweden || {};
      state.checkedShop    = saved.checkedShop   || {};
      state.shopCustom     = saved.shopCustom    || { fri_food:[], fri_drinks:[], breakfast:[], wed_drinks:[], fire:[] };
      state.actualCosts    = saved.actualCosts   || {};
      state.extraItems     = saved.extraItems    || [];
      state.extraActual    = saved.extraActual   || {};
      state.customSchedule = saved.customSchedule|| null;
      state.lastSaved      = saved.savedAt       || null;
    }
    state.syncStatus = "synced";
  } catch(e) {
    state.syncStatus = "synced";
  }
  render();
  return true;
}

async function saveToCloud() {
  state.syncStatus = "syncing";
  renderSyncBadge();
  try {
    const payload = {
      checkedTasks:  state.checkedTasks,
      checkedSweden: state.checkedSweden,
      checkedShop:   state.checkedShop,
      shopCustom:    state.shopCustom,
      actualCosts:   state.actualCosts,
      extraItems:    state.extraItems,
      extraActual:   state.extraActual,
      customSchedule: state.customSchedule || null,
      savedAt:       new Date().toISOString(),
    };
    await window.storage.set(SYNC_KEY, JSON.stringify(payload), true);
    state.syncStatus = "synced";
    state.lastSaved = payload.savedAt;
  } catch(e) {
    state.syncStatus = "error";
  }
  renderSyncBadge();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToCloud(), 800);
}

// âââ EVENTS âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function attachEvents() {
  // Tab nav
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click",()=>{ state.tab=btn.dataset.tab; render(); window.scrollTo(0,0); });
  });

  // Checkboxes â tasks
  document.querySelectorAll("[data-task]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      state.checkedTasks[cb.dataset.task]=cb.checked;
      scheduleSave(); updateStats();
    });
  });

  // Checkboxes â sweden
  document.querySelectorAll("[data-sweden]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      state.checkedSweden[cb.dataset.sweden]=cb.checked;
      scheduleSave(); updateStats();
    });
  });

  // Checkboxes â shopping
  document.querySelectorAll("[data-shop]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      state.checkedShop[cb.dataset.shop]=cb.checked;
      scheduleSave(); updateStats();
    });
  });

  // Shop new item inputs
  document.querySelectorAll("[data-shopnew]").forEach(inp=>{
    inp.addEventListener("input",()=>{ state.newShopItem[inp.dataset.shopnew]=inp.value; });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter") addShopItem(inp.dataset.shopnew); });
  });

  // Shop add buttons
  document.querySelectorAll("[data-shopadd]").forEach(btn=>{
    btn.addEventListener("click",()=>addShopItem(btn.dataset.shopadd));
  });

  // Shop remove custom
  document.querySelectorAll("[data-remove-shop]").forEach(btn=>{
    const [listKey,idx] = btn.dataset.removeShop.split(":");
    btn.addEventListener("click",()=>{
      state.shopCustom[listKey].splice(parseInt(idx),1);
      // Clean up checked state â rebuild keys
      const newChecked={};
      Object.entries(state.checkedShop).forEach(([k,v])=>{
        const [lk,i]=k.split("-");
        if(lk!==listKey) newChecked[k]=v;
      });
      state.checkedShop=newChecked;
      scheduleSave(); render();
    });
  });

  // Actual cost inputs (budget tab)
  document.querySelectorAll("[data-actual]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      state.actualCosts[inp.dataset.actual]=inp.value.replace(/[^0-9.]/g,"");
      scheduleSave(); updateSummary();
    });
  });

  // Extra item inputs
  const addExtraBtn = document.getElementById("add-extra-btn");
  if(addExtraBtn) {
    addExtraBtn.addEventListener("click",addExtraItem);
    document.getElementById("extra-item-name")?.addEventListener("keydown",e=>{ if(e.key==="Enter") addExtraItem(); });
    document.getElementById("extra-item-budget")?.addEventListener("keydown",e=>{ if(e.key==="Enter") addExtraItem(); });
  }

  // Extra actual inputs
  document.querySelectorAll("[data-extra-actual]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      state.extraActual[parseInt(inp.dataset.extraActual)]=inp.value.replace(/[^0-9.]/g,"");
      scheduleSave(); updateSummary();
    });
  });

  // Remove extra items
  document.querySelectorAll("[data-remove-extra]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i=parseInt(btn.dataset.removeExtra);
      state.extraItems.splice(i,1);
      const newEA={};
      Object.entries(state.extraActual).forEach(([k,v])=>{ const n=parseInt(k); if(n<i) newEA[k]=v; else if(n>i) newEA[n-1]=v; });
      state.extraActual=newEA;
      scheduleSave(); render();
    });
  });

  // ââ SCHEDULE EDIT HANDLERS ââââââââââââââââââââââââââââââââââââââââââââââââââ

  // Enter / exit edit mode
  document.getElementById("sched-edit")?.addEventListener("click",()=>{
    if (!state.customSchedule) {
      state.customSchedule = DAY_SCHEDULE.map(d=>({...d, events:d.events.map(e=>({...e}))}));
    }
    state.scheduleEditMode = true; render();
  });
  document.getElementById("sched-done")?.addEventListener("click",()=>{
    state.scheduleEditMode = false; scheduleSave(); render();
  });
  document.getElementById("sched-reset")?.addEventListener("click",()=>{
    if(confirm("Reset the schedule back to the original times? This can't be undone.")) {
      state.customSchedule = null; state.scheduleEditMode = false; scheduleSave(); render();
    }
  });

  // Edit time/event text inline
  document.querySelectorAll("[data-edit-time]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const [di,ei] = inp.dataset.editTime.split("-").map(Number);
      state.customSchedule[di].events[ei].time = inp.value;
      scheduleSave();
    });
  });
  document.querySelectorAll("[data-edit-event]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const [di,ei] = inp.dataset.editEvent.split("-").map(Number);
      state.customSchedule[di].events[ei].event = inp.value;
      scheduleSave();
    });
  });

  // Delete an event row
  document.querySelectorAll("[data-del-event]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const [di,ei] = btn.dataset.delEvent.split("-").map(Number);
      state.customSchedule[di].events.splice(ei,1);
      scheduleSave(); render();
    });
  });

  // Add a new event row
  document.querySelectorAll("[data-add-event]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const di = parseInt(btn.dataset.addEvent);
      const timeVal  = (document.getElementById(`new-time-${di}`)?.value||"").trim();
      const eventVal = (document.getElementById(`new-event-${di}`)?.value||"").trim();
      if (!eventVal) return;
      state.customSchedule[di].events.push({time: timeVal||"â", event: eventVal});
      scheduleSave(); render();
    });
  });

  // Drag-to-reorder (desktop + touch)
  let dragDi=null, dragEi=null, dragEl=null, touchY=0;

  function getDragTarget(el) {
    return el.closest ? el.closest(".sched-row") : null;
  }

  // Desktop drag
  document.querySelectorAll(".sched-row").forEach(row=>{
    row.addEventListener("dragstart", e=>{
      dragDi = parseInt(row.dataset.di);
      dragEi = parseInt(row.dataset.ei);
      dragEl = row;
      row.style.opacity="0.4";
      e.dataTransfer.effectAllowed="move";
    });
    row.addEventListener("dragend", ()=>{ row.style.opacity="1"; });
    row.addEventListener("dragover", e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      row.style.borderTop="2px solid #b5855a";
    });
    row.addEventListener("dragleave", ()=>{ row.style.borderTop=""; });
    row.addEventListener("drop", e=>{
      e.preventDefault();
      row.style.borderTop="";
      const targetDi = parseInt(row.dataset.di);
      const targetEi = parseInt(row.dataset.ei);
      if (dragDi===null || dragEi===null) return;
      if (dragDi!==targetDi || dragEi===targetEi) return;
      const events = state.customSchedule[dragDi].events;
      const [moved] = events.splice(dragEi,1);
      const insertAt = targetEi > dragEi ? targetEi : targetEi;
      events.splice(insertAt,0,moved);
      dragDi=null; dragEi=null;
      scheduleSave(); render();
    });
  });

  // Touch drag (mobile)
  document.querySelectorAll(".sched-row").forEach(row=>{
    row.addEventListener("touchstart", e=>{
      dragDi = parseInt(row.dataset.di);
      dragEi = parseInt(row.dataset.ei);
      dragEl = row;
      touchY = e.touches[0].clientY;
      row.style.background="#fff8f0";
    }, {passive:true});
    row.addEventListener("touchend", e=>{
      if (dragEl) dragEl.style.background="";
      // Find element under touch point
      const touch = e.changedTouches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const target = el ? el.closest(".sched-row") : null;
      if (target && target !== row) {
        const targetDi = parseInt(target.dataset.di);
        const targetEi = parseInt(target.dataset.ei);
        if (dragDi===targetDi && dragEi!==targetEi) {
          const events = state.customSchedule[dragDi].events;
          const [moved] = events.splice(dragEi,1);
          events.splice(targetEi,0,moved);
          scheduleSave(); render();
        }
      }
      dragDi=null; dragEi=null; dragEl=null;
    }, {passive:true});
  });
}

// âââ BOOT âââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function bootWithLocalStorage() {
  try {
    const saved = localStorage.getItem(SYNC_KEY);
    if(saved) {
      const d = JSON.parse(saved);
      state.checkedTasks   = d.checkedTasks  || {};
      state.checkedSweden  = d.checkedSweden || {};
      state.checkedShop    = d.checkedShop   || {};
      state.shopCustom     = d.shopCustom    || { fri_food:[], fri_drinks:[], breakfast:[], wed_drinks:[], fire:[] };
      state.actualCosts    = d.actualCosts   || {};
      state.extraItems     = d.extraItems    || [];
      state.extraActual    = d.extraActual   || {};
      state.customSchedule = d.customSchedule|| null;
    }
  } catch(e){}
  state.syncStatus = "synced";
  render();

  saveToCloud = async function() {
    try {
      const payload = { checkedTasks:state.checkedTasks, checkedSweden:state.checkedSweden, checkedShop:state.checkedShop, shopCustom:state.shopCustom, actualCosts:state.actualCosts, extraItems:state.extraItems, extraActual:state.extraActual, customSchedule:state.customSchedule||null, savedAt:new Date().toISOString() };
      localStorage.setItem(SYNC_KEY, JSON.stringify(payload));
      state.syncStatus = "synced";
      state.lastSaved = payload.savedAt;
    } catch(e) { state.syncStatus="error"; }
    renderSyncBadge();
  };
}

// Try cloud storage with a 2-second timeout fallback
let booted = false;
const bootTimeout = setTimeout(() => {
  if (!booted) { booted = true; bootWithLocalStorage(); }
}, 2000);

if (typeof window.storage !== "undefined") {
  loadFromCloud().then(() => {
    if (!booted) { booted = true; clearTimeout(bootTimeout); }
  }).catch(() => {
    if (!booted) { booted = true; clearTimeout(bootTimeout); bootWithLocalStorage(); }
  });
} else {
  clearTimeout(bootTimeout);
  booted = true;
  bootWithLocalStorage();
}
