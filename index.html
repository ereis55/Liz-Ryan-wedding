<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Liz & Ryan Wedding 2027</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#faf7f2;color:#3d2e1e;min-height:100vh}
.header{background:linear-gradient(135deg,#3d2e1e,#5c4433);padding:32px 20px;text-align:center}
.header h1{color:#faf7f2;font-size:28px;font-weight:400;margin-bottom:4px}
.header p{color:#c4a47a;font-size:15px;font-style:italic;margin-bottom:16px}
.stats{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
.stat-val{color:#b5855a;font-size:22px;font-weight:700}
.stat-lbl{color:#a08060;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.tabs{background:#faf7f2;border-bottom:1px solid #e8d8c4;padding:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:10}
.tab{background:none;border:none;padding:8px 12px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;color:#7a6355;text-transform:uppercase}
.tab.on{background:#b5855a;color:white}
.content{max-width:800px;margin:0 auto;padding:20px 16px}
.card{background:white;border:1px solid #e8d8c4;border-radius:8px;padding:16px;margin-bottom:14px}
h2{font-size:20px;font-weight:400;margin-bottom:8px}
p{font-size:13px;color:#7a6355;line-height:1.6}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5ede0;font-size:13px}
.item:last-child{border-bottom:none}
input[type=checkbox]{accent-color:#b5855a;width:16px;height:16px}
.done{text-decoration:line-through;color:#bbb}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;border:1px solid #d4c4b0;border-radius:6px;padding:8px;font-size:13px;font-family:sans-serif;outline:none}
.add button{background:#b5855a;color:white;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.budget-row{display:grid;grid-template-columns:1fr 80px 80px;gap:8px;padding:8px 0;border-bottom:1px solid #f5ede0;align-items:center;font-size:13px}
.budget-row:last-child{border-bottom:none}
.actual{border:1px solid #c8e0c0;border-radius:4px;padding:4px 6px;font-size:12px;text-align:right;width:100%;background:#f0faf0;outline:none;font-family:sans-serif}
.pill{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:700}
.pill-h{background:#fce8e8;color:#c0392b}
.pill-m{background:#fef3e2;color:#c17f3e}
.pill-l{background:#eef5ee;color:#5a8a60}
</style>
</head>
<body>
<div class="header">
  <h1>Liz &amp; Ryan</h1>
  <p>Gråbogården, Gothenburg — 2027</p>
  <div class="stats">
    <div><div class="stat-val" id="budgetVal">$39,000</div><div class="stat-lbl">Budget</div></div>
    <div><div class="stat-val" id="actualVal" style="color:#888">$0 spent</div><div class="stat-lbl">Actual</div></div>
    <div><div class="stat-val">100</div><div class="stat-lbl">Guests</div></div>
    <div><div class="stat-val" id="taskVal">0/45</div><div class="stat-lbl">Tasks Done</div></div>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<script>
const KEY = 'liz-ryan-2027';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e){}
S.tasks = S.tasks||{}; S.actual = S.actual||{}; S.shop = S.shop||{}; S.extra = S.extra||[]; S.shopCustom = S.shopCustom||{};
let tab = 'budget';

function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

const BUDGET = [
  {item:'Hotel / Accommodation',budget:0,low:0,high:0,cat:'Venue'},
  {item:'Transport - 2 Buses',budget:3200,low:1600,high:3000,cat:'Venue'},
  {item:'Tent + Equipment',budget:4000,low:5000,high:9000,cat:'Venue'},
  {item:'Food - Friday Night BBQ',budget:4200,low:3500,high:5500,cat:'Food'},
  {item:'Food - Wedding Buffet',budget:7000,low:6000,high:10000,cat:'Food'},
  {item:'Breakfast Sat + Sun',budget:500,low:350,high:700,cat:'Food'},
  {item:'Liquor - Friday Night',budget:2000,low:883,high:1291,cat:'Drinks'},
  {item:'Liquor - Wedding Open Bar',budget:5000,low:1728,high:2572,cat:'Drinks'},
  {item:'Servers / Catering Staff',budget:2000,low:1500,high:3000,cat:'People'},
  {item:'Wedding Planner',budget:0,low:500,high:2000,cat:'People'},
  {item:'Photographer',budget:2000,low:2000,high:3500,cat:'People'},
  {item:'DJ',budget:1000,low:500,high:1500,cat:'People'},
  {item:'Wedding Dress',budget:2000,low:1500,high:3000,cat:'Bridal'},
  {item:'Dress Alterations',budget:300,low:200,high:500,cat:'Bridal'},
  {item:'Reception Dress',budget:300,low:150,high:500,cat:'Bridal'},
  {item:'Liz Hair + Makeup',budget:200,low:250,high:400,cat:'Bridal'},
  {item:'Bridesmaids Hair + Beauty',budget:2000,low:1200,high:2500,cat:'Bridal'},
  {item:'Ryan Gets Ready',budget:1000,low:200,high:500,cat:'Bridal'},
  {item:'Flowers',budget:1000,low:1500,high:3000,cat:'Decor'},
  {item:'Invitations + Postage',budget:300,low:250,high:400,cat:'Extras'},
  {item:'Entertainment (cameras etc)',budget:1000,low:300,high:800,cat:'Extras'},
];

const TIMELINE = [
  {phase:'12+ Months Out',tasks:['Book Grabogarden venue','Hire wedding planner ($500-$2,000)','Book tent + equipment rental ($4,000-$9,000)','Meet with priest - confirm date','Book photographer ($2,000-$3,000)','Book DJ ($1,000)','Finalize guest list - 100 people','Book bus charter (2 x 50-seaters)','Send Save the Dates','Order + send invitations ($300)']},
  {phase:'9-12 Months Out',tasks:['Order wedding dress ($2,000)','Book hair salon for Liz + bridesmaids','Find + confirm caterer for buffet ($7,000)','Confirm servers / catering staff ($2,000)','Decide bridesmaids dress color scheme','Decide groom + groomsmen outfits']},
  {phase:'6-9 Months Out',tasks:['Chase RSVPs','Book grilling staff for Friday BBQ','Book florist or bulk flower plan','Order reception dress ($300)','Confirm space for Ryan to get ready','Confirm bridal suite at Grabogarden']},
  {phase:'3-6 Months Out',tasks:['Finalize guest count - build seating chart','Dress alterations ($300)','Print seating cards + table numbers','Confirm DJ set list + ceremony music','Order rice packets for church exit','Order disposable cameras','Buy picnic blankets ($200)','Book bridal hair trial']},
  {phase:'1-3 Months Out',tasks:['Systembolaget - wedding open bar ($5,000)','Systembolaget - Friday night drinks ($2,000)','ICA - Friday BBQ food ($1,500-$2,000)','ICA - Sat/Sun breakfast ($500)','Confirm all vendor arrival times','Send final headcount to caterer','Confirm bus pickup times with driver','Prepare gratuity envelopes']},
  {phase:'Week Of',tasks:['Tent + equipment set up at Grabogarden','Pick up flowers - arrange centerpieces','Confirm final bus schedule','Pack bridal bag: dress, shoes, vows, emergency kit','Place cameras + seating cards on tables','Hand out gratuity envelopes','Charge all devices']},
];

const SHOPPING = {
  'Friday BBQ Food (ICA)': ['Hotdogs 200 pcs','Burger patties 150 pcs','Hotdog buns 200 pcs','Burger buns 150 pcs','Bell peppers bulk','Zucchini bulk','Corn on the cob','Mushrooms','Coleslaw ready-made','Pasta salad ready-made','Green salad mix','Ketchup 3-4 bottles','Mustard 3-4 bottles','Mayonnaise 3-4 bottles','Relish 2 jars','Bread rolls bulk','Chips + dips','Paper plates 200+','Napkins bulk','Plastic utensils 200 sets','Plastic cups 300+','Aluminum foil 2 rolls','Trash bags 10+','Graham crackers 10 packs','Marshmallows 5 bags','Chocolate bars 10','Roasting sticks 50 pcs'],
  'Friday BBQ Drinks (Systembolaget)': ['Beer 200 cans','Red wine 10-12 bottles','White wine 10-12 bottles','Aperol 6-8 bottles','Prosecco 15-20 bottles','Soda water 20 bottles','Soft drinks bulk','Sparkling water bulk','Still water bulk','Ice 10-15 kg bags','Lemon + lime garnish','Paper straws 200','Plastic wine glasses 200','Cooler bags 4-6'],
  'Sat+Sun Breakfast (ICA)': ['Sliced bread 2-3 loaves','Knackebrod 2 packs','Croissants or kanelbullar 20 pcs','Eggs 24','Butter 2-3 packs','Cheese slices assorted','Ham / deli slices','Salami 1 pack','Yogurt 4-5 tubs','Granola 2 bags','Bananas 2 bunches','Apples 1 bag','Grapes 1 bunch','Jam strawberry + lingonberry','Orange juice 3-4 cartons','Coffee 2 packs','Tea bags 1-2 boxes','Milk + oat milk 3-4 liters','Sugar 1 bag','Paper plates small 50','Coffee cups 50','Napkins 1 pack'],
  'Wedding Open Bar (Systembolaget)': ['Beer 300-350 cans','Red wine 20-25 bottles','White wine 20-25 bottles','Rose 5-8 bottles','Champagne toast 15-20 bottles','Aperol 4-6 bottles','Prosecco spritzes 10-12 bottles','Vodka 3-4 bottles','Gin 2-3 bottles','Whiskey 2-3 bottles','Tonic water bulk','Cola bulk','Lemon soda bulk','OJ mixer 4-6 cartons','Cranberry juice 3-4 cartons','Soda water bulk','Sparkling water bulk','Still water bulk','Ice 20-25 kg bags','Lemon + lime garnish','Mint 3-4 bunches','Cocktail napkins 500','Straws 500'],
  'Firewood + Smores': ['Firewood birch or oak 80-100 kg','Kindling 2 packs','Fire starter sticks','Long matches or lighter','Fire poker tongs','Fire safety bucket','Graham crackers 10 packs','Marshmallows 5 bags','Chocolate bars 10-12','Roasting sticks 50 pcs','Picnic blankets 10-15'],
};

const SWEDEN = [
  {cat:'Venue - Grabogarden',items:['Walk full property - tent location ceremony spot bus parking','Confirm whats included: chairs linens tables kitchen bedding','Confirm: delivery access vendor arrival windows noise curfew','Taste food + review buffet menu options','Confirm overnight sleeping for 16 breakfast guests','Photograph space at same time of day as ceremony']},
  {cat:'Church + Ceremony',items:['Meet with priest - confirm 2027 date','Understand requirements: meetings documents needed','Walk church exterior - plan rice throw exit + photos','Ask about church music: organ available?','Drive church to Grabogarden bus route yourself']},
  {cat:'DJ + Entertainment',items:['Meet 2-3 local DJs - hear samples discuss music vibe','Confirm DJ equipment: do they bring speakers?','Discuss full flow: cocktail hour dinner dancing']},
  {cat:'Photographer',items:['Meet 2-3 Gothenburg photographers - review full galleries','Discuss coverage: ceremony cocktail reception getting-ready','Do a test shoot together at Grabogarden','Confirm contract deposit and delivery timeline']},
  {cat:'Flowers + Decor',items:['Visit Goteborgs Saluhall or local flower market','Meet 1-2 florists for quote on ceremony arch + tables','Confirm flower season for wedding month']},
  {cat:'Hair + Beauty',items:['Book bridal hair trial at Gothenburg salon ($150-$250)','Book salon for wedding morning: Liz + 5 bridesmaids','Confirm timing so everyone is ready by 2:00 PM']},
  {cat:'Wedding Planner',items:['Meet 2-3 wedding planners in Gothenburg','Review vendor relationships - can they get better rates?','Confirm they coordinate comfortably in English']},
  {cat:'Logistics',items:['Confirm bridal suite getting-ready space at Grabogarden','Visit Systembolaget - ask about bulk pre-orders','Visit ICA Maxi near Grabo - confirm shopping list','Confirm outdoor space for Friday BBQ fire pit','Enjoy Gothenburg together - celebrate your wedding city!']},
];

const SCHEDULE = [
  {day:'Friday - Night Before BBQ',color:'#7a6e5f',events:[['4:00 PM','Grilling staff arrives - fire setup food prep'],['5:00 PM','Guests arrive at picnic area'],['5:00-6:00 PM','Welcome drinks - Aperol Spritzes beer wine'],['6:00-9:00 PM','BBQ picnic - hotdogs burgers grilled veg + sides'],['7:00 PM','Bonfire + smores station opens'],['9:00 PM+','Music drinks relaxed evening']]},
  {day:'Saturday - Wedding Day',color:'#b5855a',events:[['9:00 AM','Self-serve breakfast for 16'],['10:30 AM','Photographer arrives - getting-ready shots Liz + bridesmaids'],['11:00 AM','Liz + bridesmaids hair + makeup begins'],['12:00 PM','Photographer captures Ryan + groomsmen'],['1:30 PM','Bridal party portraits + family formals'],['2:00 PM','Buses depart to church - 100 guests'],['3:00 PM','Ceremony begins - full photo coverage'],['3:45 PM','Rice throw exit!'],['4:00 PM','Buses depart church to Grabogarden'],['4:30 PM','Arrival - cocktail hour candid shots'],['5:00 PM','Golden hour portraits at Grabogarden'],['5:30 PM','Open bar opens (5-6 hours)'],['6:00 PM','Buffet dinner served'],['8:00 PM','Speeches + first dance'],['9:00 PM','DJ set - dancing begins'],['10:30 PM','Liz changes into reception dress'],['11:00 PM','Photographer wraps - party continues!']]},
  {day:'Sunday - Morning After',color:'#6b8a70',events:[['9:00 AM','Self-serve breakfast for overnight guests'],['10:00 AM','Relaxed morning - coffee pastries'],['11:00 AM','Checkout + goodbyes']]},
];

const TABS = ['budget','schedule','shopping','sweden','todo'];
const TLABELS = ['Budget','Schedule','Shopping','Sweden Trip','To-Do'];

function render(){
  // tabs
  document.getElementById('tabs').innerHTML = TABS.map((t,i)=>`<button class="tab${tab===t?' on':''}" onclick="setTab('${t}')">${TLABELS[i]}</button>`).join('');
  
  // update header stats
  const totalActual = BUDGET.reduce((s,r)=>s+(parseFloat(S.actual[r.item])||0),0) + S.extra.reduce((s,r,i)=>s+(parseFloat(r.actual)||0),0);
  const taskDone = Object.values(S.tasks).filter(Boolean).length;
  const taskTotal = TIMELINE.reduce((s,p)=>s+p.tasks.length,0);
  document.getElementById('actualVal').textContent = totalActual===0?'$0 spent':'$'+Math.round(totalActual).toLocaleString()+' spent';
  document.getElementById('actualVal').style.color = totalActual===0?'#888':totalActual>39000?'#e07070':'#7aaa7a';
  document.getElementById('taskVal').textContent = taskDone+'/'+taskTotal;
  
  if(tab==='budget') renderBudget();
  else if(tab==='schedule') renderSchedule();
  else if(tab==='shopping') renderShopping();
  else if(tab==='sweden') renderSweden();
  else if(tab==='todo') renderTodo();
}

function setTab(t){ tab=t; render(); window.scrollTo(0,0); }

function renderBudget(){
  const totalActual = BUDGET.reduce((s,r)=>s+(parseFloat(S.actual[r.item])||0),0) + S.extra.reduce((s,r)=>s+(parseFloat(r.actual)||0),0);
  const totalBudget = 39000 + S.extra.reduce((s,r)=>s+r.budget,0);
  const diff = totalActual - totalBudget;
  
  let html = '<h2>Full Budget</h2><p style="margin-bottom:16px">Type what you actually paid in the green column</p>';
  html += '<div class="card">';
  html += '<div class="budget-row" style="font-size:10px;font-weight:700;text-transform:uppercase;color:#7a6355;background:#f5ede0;padding:8px;border-radius:4px 4px 0 0"><span>Item</span><span style="text-align:right">Budgeted</span><span style="text-align:right;color:#5a8a60">Actual $</span></div>';
  BUDGET.forEach(r=>{
    const a = S.actual[r.item]||'';
    html += `<div class="budget-row"><span>${r.item}</span><span style="text-align:right;font-weight:700;color:${r.budget===0?'#bbb':'#b5855a'}">${r.budget===0?'FREE':'$'+r.budget.toLocaleString()}</span><span><input class="actual" type="text" inputmode="decimal" placeholder="0" value="${a}" onchange="S.actual['${r.item}']=this.value.replace(/[^0-9.]/g,'');save();render()"/></span></div>`;
  });
  // Extra items
  S.extra.forEach((r,i)=>{
    html += `<div class="budget-row"><span>${r.item} <button onclick="S.extra.splice(${i},1);save();render()" style="background:none;border:none;color:#e07070;cursor:pointer;font-size:13px">×</button></span><span style="text-align:right;font-weight:700;color:#b5855a">$${r.budget.toLocaleString()}</span><span><input class="actual" type="text" inputmode="decimal" placeholder="0" value="${r.actual||''}" onchange="S.extra[${i}].actual=this.value;save();render()"/></span></div>`;
  });
  html += `<div class="budget-row" style="background:#3d2e1e;padding:10px;border-radius:0 0 4px 4px"><span style="font-weight:700;color:#d4b896;font-size:11px;text-transform:uppercase">TOTAL</span><span style="text-align:right;font-weight:700;color:#b5855a;font-size:15px">$${totalBudget.toLocaleString()}</span><span style="text-align:right;font-weight:700;color:${totalActual===0?'#666':diff>0?'#e07070':'#7aaa7a'};font-size:14px">${totalActual===0?'—':'$'+Math.round(totalActual).toLocaleString()}</span></div>`;
  html += '</div>';
  
  // Add extra item
  html += `<div class="card"><div style="font-weight:700;margin-bottom:10px;font-size:14px">+ Add Custom Budget Item</div><div class="add"><input id="ei" placeholder="Item name" style="flex:2"/><input id="eb" placeholder="$0" style="width:70px;flex:none"/><button onclick="addExtra()">Add</button></div></div>`;
  
  document.getElementById('content').innerHTML = html;
}

function addExtra(){
  const name = document.getElementById('ei').value.trim();
  const budget = parseFloat(document.getElementById('eb').value.replace(/[^0-9.]/g,''))||0;
  if(!name) return;
  S.extra.push({item:name,budget,actual:''});
  save(); render();
}

function renderSchedule(){
  let html = '<h2>Wedding Day Schedule</h2><p style="margin-bottom:16px">Full timeline across all 3 days</p>';
  SCHEDULE.forEach(day=>{
    html += `<div class="card" style="border-top:4px solid ${day.color}"><div style="background:${day.color};margin:-16px -16px 12px;padding:12px 16px;color:white;font-size:15px;font-family:Georgia,serif">${day.day}</div>`;
    day.events.forEach(([time,event])=>{
      html += `<div style="display:grid;grid-template-columns:85px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #f5ede0;font-size:13px"><span style="font-weight:700;color:${day.color}">${time}</span><span>${event}</span></div>`;
    });
    html += '</div>';
  });
  document.getElementById('content').innerHTML = html;
}

function renderShopping(){
  let html = '<h2>Shopping Lists</h2><p style="margin-bottom:16px">Check off as you shop. Add your own items.</p>';
  Object.entries(SHOPPING).forEach(([listName, items])=>{
    const key = listName.replace(/[^a-z]/gi,'_');
    S.shop[key] = S.shop[key]||{};
    S.shopCustom[key] = S.shopCustom[key]||[];
    const allItems = [...items, ...S.shopCustom[key]];
    const done = allItems.filter((_,i)=>S.shop[key][i]).length;
    html += `<div class="card"><div style="background:#3d2e1e;margin:-16px -16px 12px;padding:12px 16px;color:#faf7f2;font-size:14px;font-family:Georgia,serif;display:flex;justify-content:space-between"><span>${listName}</span><span style="color:${done===allItems.length?'#7aaa7a':'#d4b896'};font-size:12px">${done}/${allItems.length}</span></div>`;
    allItems.forEach((item,i)=>{
      const checked = !!S.shop[key][i];
      const isCustom = i >= items.length;
      html += `<div class="item"><input type="checkbox" ${checked?'checked':''} onchange="S.shop['${key}'][${i}]=this.checked;save();render()"/><span class="${checked?'done':''}" style="flex:1">${item}</span>${isCustom?`<button onclick="S.shopCustom['${key}'].splice(${i-items.length},1);delete S.shop['${key}'];save();render()" style="background:none;border:none;color:#e07070;cursor:pointer">×</button>`:''}</div>`;
    });
    html += `<div class="add"><input id="si_${key}" placeholder="Add item..."/><button onclick="addShop('${key}','si_${key}')">Add</button></div></div>`;
  });
  document.getElementById('content').innerHTML = html;
}

function addShop(key, inputId){
  const val = document.getElementById(inputId).value.trim();
  if(!val) return;
  S.shopCustom[key].push(val);
  save(); render();
}

function renderSweden(){
  let html = '<h2>Sweden Summer Visit</h2><p style="margin-bottom:16px">Your scouting mission - leave with every vendor confirmed.</p>';
  const totalDone = SWEDEN.reduce((s,c,ci)=>s+c.items.filter((_,ti)=>S.tasks['sw_'+ci+'_'+ti]).length,0);
  const total = SWEDEN.reduce((s,c)=>s+c.items.length,0);
  html += `<div style="font-size:13px;color:#5a7ea8;font-weight:700;margin-bottom:12px">${totalDone} of ${total} tasks complete</div>`;
  html += `<div style="height:4px;background:#e8d8c4;border-radius:2px;margin-bottom:16px;overflow:hidden"><div style="height:100%;width:${total>0?Math.round(totalDone/total*100):0}%;background:#5a7ea8;border-radius:2px"></div></div>`;
  SWEDEN.forEach((cat,ci)=>{
    html += `<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:10px;color:#3d2e1e">${cat.cat}</div>`;
    cat.items.forEach((item,ti)=>{
      const k = 'sw_'+ci+'_'+ti;
      const checked = !!S.tasks[k];
      html += `<div class="item"><input type="checkbox" ${checked?'checked':''} onchange="S.tasks['${k}']=this.checked;save();render()"/><span class="${checked?'done':''}">${item}</span></div>`;
    });
    html += '</div>';
  });
  document.getElementById('content').innerHTML = html;
}

function renderTodo(){
  const total = TIMELINE.reduce((s,p)=>s+p.tasks.length,0);
  const done = Object.values(S.tasks).filter((v,k)=>!String(k).startsWith('sw_')&&v).length;
  let html = '<h2>Master To-Do List</h2>';
  html += `<div style="font-size:13px;color:#b5855a;font-weight:700;margin-bottom:8px">${done} of ${total} tasks complete</div>`;
  html += `<div style="height:4px;background:#e8d8c4;border-radius:2px;margin-bottom:16px;overflow:hidden"><div style="height:100%;width:${total>0?Math.round(done/total*100):0}%;background:#b5855a;border-radius:2px"></div></div>`;
  TIMELINE.forEach((phase,pi)=>{
    const pDone = phase.tasks.filter((_,ti)=>S.tasks['t_'+pi+'_'+ti]).length;
    html += `<div style="margin-bottom:18px;border-left:3px solid #b5855a;padding-left:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong style="font-size:14px">${phase.phase}</strong><span style="font-size:11px;color:${pDone===phase.tasks.length?'#6b8a70':'#b5855a'};font-weight:700">${pDone}/${phase.tasks.length}</span></div><div class="card">`;
    phase.tasks.forEach((task,ti)=>{
      const k = 't_'+pi+'_'+ti;
      const checked = !!S.tasks[k];
      html += `<div class="item"><input type="checkbox" ${checked?'checked':''} onchange="S.tasks['${k}']=this.checked;save();render()"/><span class="${checked?'done':''}" style="flex:1">${task}</span></div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('content').innerHTML = html;
}

render();
</script>

</body>
</html>
