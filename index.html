<html lang="en">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Lato',sans-serif;background:#f5f0e8;min-height:100vh;color:#1a0a0a;overscroll-behavior:none}
.pt{font-family:'Playfair Display',serif}
h1,h2,h3{font-family:'Playfair Display',serif}
input,select,button{font-family:'Lato',sans-serif}
/* NAV */
.nav-wrap{background:#f5f0e8;border-bottom:1px solid #d4c4b4;padding:6px 8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.nav-btn{background:none;border:none;cursor:pointer;padding:7px 10px;border-radius:5px;font-size:11px;letter-spacing:.04em;transition:all .18s;color:#7a3a2a;font-weight:700;text-transform:uppercase;white-space:nowrap}
.nav-btn:hover,.nav-btn.act{background:#9b2335;color:white}
/* HEADER */
.header{background:linear-gradient(135deg,#7a1a1a,#9b2335);padding:28px 20px 20px;text-align:center;position:relative;overflow:hidden}
.header-bg{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 20% 50%,rgba(255,200,180,.15) 0%,transparent 60%),radial-gradient(circle at 80% 20%,rgba(255,200,180,.1) 0%,transparent 50%)}
.header-inner{position:relative}
.header h1{color:#f5f0e8;font-size:32px;font-weight:400;margin-bottom:3px}
.header p{color:#f0ccc0;font-size:15px;font-style:italic;margin-bottom:16px}
.header-stats{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.stat{text-align:center}
.stat-val{font-family:'Playfair Display',serif;color:#ffd0c0;font-size:20px;font-weight:700}
.stat-lbl{color:#e0b0a0;font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.budget-note{background:#5a0f0f;padding:8px 16px;text-align:center;color:#f0ccc0;font-size:12px;line-height:1.5}
/* CONTENT */
.content{max-width:860px;margin:0 auto;padding:20px 14px 40px}
/* CARDS */
.card{background:white;border:1px solid #e0d0c0;border-radius:8px;overflow:hidden;margin-bottom:14px}
.card-header{padding:12px 16px;background:#7a1a1a;color:#f5f0e8;font-size:15px;font-weight:400}
.section-title{font-size:21px;font-weight:400;margin-bottom:4px;color:#7a1a1a}
.section-sub{color:#6a3a2a;font-size:13px;margin-bottom:18px}
/* TABLE */
.tbl-head{display:grid;padding:7px 13px;background:#f5f0e8;border-bottom:1px solid #e0d0c0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a3a2a}
.tbl-row{display:grid;padding:9px 13px;border-bottom:1px solid #f5f0e8;align-items:center;transition:background .12s}
.tbl-row:hover{background:rgba(155,35,53,.06)}
.tbl-foot{display:grid;padding:11px 13px;background:#7a1a1a}
/* STATUS DOTS */
.dot{border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:white;flex-shrink:0}
.dot-ok{background:#5a7a50}
.dot-warn{background:#b05020}
.dot-note{background:#4a6a9a}
/* PROGRESS BAR */
.prog-wrap{height:5px;background:#e0d0c0;border-radius:3px;overflow:hidden;margin-bottom:20px}
.prog-bar{height:100%;border-radius:3px;transition:width .4s}
/* INPUTS */
.inp{border:1px solid #d4c4b0;border-radius:5px;padding:7px 10px;font-size:13px;color:#1a0a0a;outline:none;background:#faf5f0;width:100%}
.inp:focus{border-color:#9b2335;background:#fff}
.actual-inp{width:78px;padding:5px 6px 5px 16px;border:1px solid #c8e0c0;border-radius:5px;font-size:12px;text-align:right;background:#fafcfa;color:#1a4a1a;outline:none}
.actual-inp:focus{border-color:#4a8a50;background:#f0f8f0}
.actual-wrap{position:relative;display:inline-flex;align-items:center}
.actual-prefix{position:absolute;left:7px;font-size:11px;color:#4a8a50;font-weight:700;pointer-events:none}
/* PILL */
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill-high{background:#fce8e8;color:#9b2335}
.pill-med{background:#fef3e2;color:#b05020}
.pill-low{background:#eef5ee;color:#4a7a40}
/* CHECKBOX */
input[type=checkbox]{accent-color:#9b2335;width:16px;height:16px;cursor:pointer;flex-shrink:0}
/* TASK ROW */
.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid #f0e8e0;cursor:pointer;transition:background .12s}
.task-row:hover{background:rgba(155,35,53,.05)}
.task-row label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;width:100%}
/* TIMELINE */
.phase-wrap{margin-bottom:20px;border-left:3px solid #9b2335;padding-left:16px}
.phase-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
/* SHOPPING */
.shop-store{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;color:white}
/* ADD ROW */
.add-row{padding:9px 14px;background:#faf5f0;border-top:1px dashed #d4c4b4;display:flex;gap:8px;align-items:center}
/* DAY TIMELINE */
.day-card{border-radius:8px;overflow:hidden;margin-bottom:16px;border-top:4px solid}
.day-event{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 16px;border-bottom:1px solid #f5f0e8;align-items:start}
/* GRAND SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.summary-card{text-align:center;padding:12px 6px;background:rgba(255,255,255,.07);border-radius:6px}
/* SYNC BADGE */
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#5a8a50;padding:4px 10px;background:rgba(90,138,80,.12);border-radius:20px;margin-bottom:16px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#5a8a50;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* MOBILE SCROLL */
.scr{max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scr::-webkit-scrollbar{width:4px}
.scr::-webkit-scrollbar-thumb{background:#c0a090;border-radius:3px}
/* EMPTY STATE */
.empty{text-align:center;padding:36px 20px;border:1px dashed #d4c4b4;border-radius:8px;color:#8a5a4a}
/* OVER/UNDER */
.over{color:#c02030}
.under{color:#4a8a50}
/* GRID HELPERS */
.budget-cols{grid-template-columns:20px 1fr 82px 100px 88px 1fr}
.budget-cols-mobile{grid-template-columns:20px 1fr 80px 86px 28px}
@media(max-width:600px){
  .budget-cols{grid-template-columns:20px 1fr 70px 80px}
  .hide-mobile{display:none!important}
  .summary-grid{grid-template-columns:1fr 1fr}
  .nav-btn{font-size:10px;padding:6px 7px}
  .header h1{font-size:26px}
}
select{border:1px solid #d4c4b0;border-radius:5px;padding:7px 8px;font-size:12px;color:#1a0a0a;background:#faf5f0;outline:none}
</style>
</head>

// ─── SYNC ────────────────────────────────────────────────────────────────────
const SYNC_KEY = "liz-ryan-wedding-2027";
let saveTimer = null;

async function loadFromCloud() {
  try {
    const result = await window.storage.get(SYNC_KEY, true);
    if (result && result.value) {
      const saved = JSON.parse(result.value);
      state.checkedTasks        = saved.checkedTasks        || {};
      state.checkedSweden       = saved.checkedSweden       || {};
      state.checkedShop         = saved.checkedShop         || {};
      state.shopCustom          = saved.shopCustom          || { fri_food:[], fri_drinks:[], breakfast:[], wed_drinks:[], fire:[] };
      state.actualCosts         = saved.actualCosts         || {};
      state.extraItems          = saved.extraItems          || [];
      state.extraActual         = saved.extraActual         || {};
      state.customSchedule      = saved.customSchedule      || null;
      state.customBudget        = saved.customBudget        || null;
      state.customTimeline      = saved.customTimeline      || null;
      state.customSweden        = saved.customSweden        || null;
      state.customShoppingLists = saved.customShoppingLists || null;
      state.lastSaved           = saved.savedAt             || null;
    }
    state.syncStatus = "synced";
  } catch(e) {
    state.syncStatus = "synced";
  }
  render();
  return true;
}

async function saveToCloud() {
  state.syncStatus = "syncing";
  renderSyncBadge();
  try {
    const payload = {
      checkedTasks:        state.checkedTasks,
      checkedSweden:       state.checkedSweden,
      checkedShop:         state.checkedShop,
      shopCustom:          state.shopCustom,
      actualCosts:         state.actualCosts,
      extraItems:          state.extraItems,
      extraActual:         state.extraActual,
      customSchedule:      state.customSchedule  || null,
      customBudget:        state.customBudget     || null,
      customTimeline:      state.customTimeline   || null,
      customSweden:        state.customSweden     || null,
      customShoppingLists: state.customShoppingLists || null,
      customNBCosts:       state.customNBCosts    || null,
      customNBFood:        state.customNBFood     || null,
      customNBDrinks:      state.customNBDrinks   || null,
      savedAt:             new Date().toISOString(),
    };
    await window.storage.set(SYNC_KEY, JSON.stringify(payload), true);
    state.syncStatus = "synced";
    state.lastSaved = payload.savedAt;
  } catch(e) {
    state.syncStatus = "error";
  }
  renderSyncBadge();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToCloud(), 800);
}

const $ = id => document.getElementById(id);
const fmt = n => n===0?"—":"$"+Math.round(n).toLocaleString();
const fmtBudget = n => n===0?"—":"$"+n.toLocaleString();
const dotClass = s => s==="ok"?"dot dot-ok":s==="warning"?"dot dot-warn":"dot dot-note";
const dotIcon  = s => s==="ok"?"✓":s==="warning"?"⚠":"ℹ";
const pillClass = p => p==="high"?"pill pill-high":p==="medium"?"pill pill-med":"pill pill-low";

function renderSyncBadge() {
  const el = $("sync-badge");
  if (!el) return;
  if (state.syncStatus==="syncing") {
    el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:#f0c060;display:inline-block"></span> Saving...`;
  } else if (state.syncStatus==="error") {
    el.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:#e07070;display:inline-block"></span> Sync error`;
  } else {
    const t = state.lastSaved ? new Date(state.lastSaved).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) : "never";
    el.innerHTML = `<span class="sync-dot"></span> Synced across all devices · Last saved ${t}`;
  }
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  app.innerHTML = buildApp();
  attachEvents();
  renderSyncBadge();
}

// Attach a live-updating input handler that writes directly to state and saves
// WITHOUT triggering a re-render — so typing is never interrupted
function liveInput(selector, getTarget) {
  document.querySelectorAll(selector).forEach(inp => {
    inp.addEventListener("input", () => {
      getTarget(inp, inp.value);
      scheduleSave();
    });
  });
}

// ── SWEDEN TAB ────────────────────────────────────────────────────────────────
function buildSwedenTab() {
  if (!state.customSweden) state.customSweden = SWEDEN_TRIP.map(c=>({...c,tasks:c.tasks.map(t=>({...t}))}));
  const sweden = state.customSweden;
  const em = state.swedenEditMode;
  const total = sweden.reduce((s,c)=>s+c.tasks.length,0);
  const done  = Object.values(state.checkedSweden).filter(Boolean).length;
  const pct   = total>0?Math.round((done/total)*100):0;

  const cats = sweden.map((cat,ci)=>{
    const catDone = cat.tasks.filter((_,ti)=>state.checkedSweden[`${ci}-${ti}`]).length;
    const tasks = cat.tasks.map((t,ti)=>{
      const k=`${ci}-${ti}`;
      const checked = !!state.checkedSweden[k];
      if (em) return `<div style="display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-bottom:1px solid #f5f0e8">
        <span style="color:#ccc;font-size:14px;cursor:grab;flex-shrink:0;margin-top:2px" class="swd-drag" data-sci="${ci}" data-sti="${ti}">☰</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:4px">
          <input value="${t.task.replace(/"/g,"&quot;").replace(/'/g,"&#39;")}" data-sedit-task="${ci}-${ti}" style="border:1px solid #e0d0c0;border-radius:4px;padding:4px 7px;font-size:12px;outline:none;background:#faf5f0;width:100%"/>
          <input value="${(t.tip||"").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}" data-sedit-tip="${ci}-${ti}" placeholder="Tip..." style="border:1px solid #e8ddd0;border-radius:4px;padding:3px 7px;font-size:11px;outline:none;background:#fffdf8;width:100%;color:#7a3a2a"/>
        </div>
        <button data-sdel="${ci}-${ti}" style="background:none;border:none;cursor:pointer;color:#c0392b;font-size:15px;padding:0;margin-top:2px;flex-shrink:0">×</button>
      </div>`;
      return `<label class="task-row" style="display:flex">
        <input type="checkbox" ${checked?"checked":""} data-sweden="${k}" style="margin-top:2px"/>
        <div style="flex:1">
          <div style="font-size:13px;color:${checked?"#bbb":"#6a1010"};text-decoration:${checked?"line-through":"none"};line-height:1.5;margin-bottom:2px">${t.task}</div>
          <div style="font-size:11px;color:${checked?"#ccc":"#7a3a2a"};font-style:italic">💡 ${t.tip||""}</div>
        </div>
      </label>`;
    }).join("");

    const addTaskRow = em ? `<div style="padding:8px 12px;background:#faf5f0;border-top:1px dashed #e0d0c0;display:flex;gap:6px;align-items:center">
      <span style="color:#9b2335;font-size:16px">+</span>
      <input id="snew-task-${ci}" placeholder="New task..." style="flex:1;border:1px solid #d4c4b0;border-radius:4px;padding:6px 8px;font-size:12px;outline:none;background:white"/>
      <button data-sadd="${ci}" style="background:#9b2335;color:white;border:none;border-radius:4px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer">Add</button>
    </div>` : "";

    return `
      <div style="margin-bottom:18px;border-left:3px solid ${cat.color};padding-left:16px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
          <h3 style="font-size:15px;font-weight:700;color:#6a1010;flex:1">${cat.category}</h3>
          <span style="font-size:11px;color:${catDone===cat.tasks.length?"#6b8a70":cat.color};font-weight:700">${catDone}/${cat.tasks.length}</span>
        </div>
        <div class="card" style="border-radius:8px;overflow:hidden">${tasks}${addTaskRow}</div>
      </div>`;
  }).join("");

  const editBar = em ? `
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button id="swdone" style="background:#6b8a70;color:white;border:none;border-radius:6px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer">✓ Done Editing</button>
      <button id="swreset" style="background:none;border:1px solid #c17f3e;color:#c17f3e;border-radius:6px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer">↺ Reset</button>
    </div>` :
    `<button id="swedit" style="background:none;border:1px solid #5a7ea8;color:#5a7ea8;border-radius:6px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:14px">✏️ Edit Tasks</button>`;

  return `
    <h2 class="section-title">🇸🇪 Sweden Summer Visit</h2>
    <p class="section-sub" style="margin-bottom:10px">Your scouting mission — leave with every vendor confirmed.</p>
    ${editBar}
    <div style="font-size:13px;color:#5a7ea8;font-weight:700;margin-bottom:16px">${done} of ${total} tasks complete (${pct}%)</div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%;background:linear-gradient(90deg,#5a7ea8,#7aabe8)"></div></div>
    ${cats}`;
}

function buildDayOfTab() {
  // Use state.customSchedule if it exists, otherwise seed from DAY_SCHEDULE
  if (!state.customSchedule) {
    state.customSchedule = DAY_SCHEDULE.map(day=>({
      day: day.day, emoji: day.emoji, color: day.color,
      events: day.events.map(e=>({...e}))
    }));
  }

  const editMode = state.scheduleEditMode || false;

  const days = state.customSchedule.map((day, di)=>{
    const events = day.events.map((ev, ei)=>{
      if (editMode) {
        return `<div class="sched-row" data-di="${di}" data-ei="${ei}" draggable="true"
          style="display:grid;grid-template-columns:28px 100px 1fr 28px;gap:8px;padding:8px 12px;border-bottom:1px solid #f5f0e8;align-items:center;background:white;cursor:grab;touch-action:none">
          <span style="font-size:16px;color:#ccc;cursor:grab;user-select:none" title="Drag to reorder">☰</span>
          <input value="${ev.time}" data-edit-time="${di}-${ei}"
            style="border:1px solid #e0d0c0;border-radius:4px;padding:4px 6px;font-size:11px;font-weight:700;color:${day.color};background:#faf5f0;width:100%;outline:none"/>
          <input value="${ev.event}" data-edit-event="${di}-${ei}"
            style="border:1px solid #e0d0c0;border-radius:4px;padding:4px 8px;font-size:12px;color:#6a1010;background:#faf5f0;width:100%;outline:none"/>
          <button data-del-event="${di}-${ei}" style="background:none;border:none;cursor:pointer;color:#c0392b;font-size:16px;padding:0;line-height:1;flex-shrink:0">×</button>
        </div>`;
      } else {
        return `<div class="day-event" style="border-bottom:${ei<day.events.length-1?"1px solid #f5f0e8":"none"}">
          <span style="font-size:11px;font-weight:700;color:${day.color}">${ev.time}</span>
          <span style="font-size:13px;line-height:1.5">${ev.event}</span>
        </div>`;
      }
    }).join("");

    const addRow = editMode ? `
      <div style="padding:9px 12px;background:#faf5f0;border-top:1px dashed #e0d0c0;display:flex;gap:8px;align-items:center">
        <span style="font-size:16px;color:#9b2335">+</span>

          style="flex:1;border:1px solid #d4c4b0;border-radius:4px;padding:6px 8px;font-size:12px;color:#6a1010;background:white;outline:none"/>
        <button data-add-event="${di}" style="background:#9b2335;color:white;border:none;border-radius:4px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">Add</button>
      </div>` : "";

    return `<div class="day-card" style="border-top-color:${day.color};margin-bottom:16px">
      <div style="background:${day.color};padding:12px 16px">
        <h3 style="color:white;font-size:17px;font-weight:400">${day.emoji} ${day.day}</h3>
      </div>
      <div id="events-${di}">${events}</div>
      ${addRow}

  }).join("");

  const editBtn = editMode
    ? `<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
        <button id="sched-done" style="background:#6b8a70;color:white;border:none;border-radius:6px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer">✓ Done Editing</button>

  const cats = state.customPacking.map((cat, ci) => {

function buildExtrasTab() {
  const extraBudget = state.extraItems.reduce((s,r)=>s+r.budget,0);

  const allActual = BUDGET_LINES.reduce((s,r)=>s+(parseFloat(state.actualCosts[r.item])||0),0) + extraActualTotal;
  const diff = allActual - allBudget;

  const statusColor = s=>s==="ok"?"#6b8a70":s==="warning"?"#c17f3e":"#5a7ea8";

  const tableRows = state.extraItems.length===0
    ? `<div class="empty"><div style="font-size:28px;margin-bottom:8px">📋</div><div style="font-family:'Playfair Display',serif;font-size:15px;margin-bottom:6px">No extra items yet</div><div style="font-size:13px">Add items above — they'll roll into your grand total automatically.</div></div>`

        </div>
      </div>`;

  return `

    <p class="section-sub">Anything not in the main list — honeymoon, rehearsal dinner, favors, tips, extra guests, etc. These roll into your grand total automatically.</p>

          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a3a2a;margin-bottom:4px">Item name</div>

        </div>
        <div>
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a3a2a;margin-bottom:4px">Budget ($)</div>
          <div class="actual-wrap" style="width:100%">
            <span class="actual-prefix" style="color:#9b2335">$</span>
            <input id="extra-item-budget" class="actual-inp" type="text" inputmode="decimal" placeholder="0" value="${state.newExtra.budget}" style="width:100%;border-color:#d4c4b0;background:#faf5f0;color:#6a1010"/>
          </div>
        </div>
        <div>
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7a3a2a;margin-bottom:4px">Status</div>
          <select id="extra-item-status" style="width:100%;padding:8px;font-size:12px;border:1px solid #d4c4b0;background:#faf5f0">
            <option value="ok" ${state.newExtra.status==="ok"?"selected":""}>✓ On Track</option>
            <option value="warning" ${state.newExtra.status==="warning"?"selected":""}>⚠ Revisit</option>
            <option value="note" ${state.newExtra.status==="note"?"selected":""}>ℹ Note</option>
          </select>
        </div>
        <button id="add-extra-btn" style="background:#9b2335;color:white;border:none;border-radius:5px;width:36px;height:36px;font-size:20px;cursor:pointer;align-self:flex-end">+</button>
      </div>
    </div>

    ${tableRows}`;
}

// ── CHECKLIST TAB ─────────────────────────────────────────────────────────────
function buildChecklistTab() {
  if (!state.customTimeline) state.customTimeline = TIMELINE.map(p=>({...p,tasks:p.tasks.map(t=>({...t}))}));
  const timeline = state.customTimeline;
  const em = state.timelineEditMode;
  const total = timeline.reduce((s,p)=>s+p.tasks.length,0);
  const done  = Object.values(state.checkedTasks).filter(Boolean).length;
  const pct   = total>0?Math.round((done/total)*100):0;

  const phases = timeline.map((phase,pi)=>{
    const pDone = phase.tasks.filter((_,ti)=>state.checkedTasks[`${pi}-${ti}`]).length;
    const tasks = phase.tasks.map((task,ti)=>{
      const k=`${pi}-${ti}`;
      const checked=!!state.checkedTasks[k];
      if (em) return `<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f5f0e8">
        <span style="color:#ccc;font-size:14px;cursor:grab;flex-shrink:0" class="tl-drag" data-tpi="${pi}" data-tti="${ti}">☰</span>
        <input value="${(task.task||task).replace(/"/g,"&quot;").replace(/'/g,"&#39;")}" data-tedit="${pi}-${ti}" style="flex:1;border:1px solid #e0d0c0;border-radius:4px;padding:5px 7px;font-size:12px;outline:none;background:#faf5f0"/>
        <select data-tpriority="${pi}-${ti}" style="border:1px solid #e0d0c0;border-radius:4px;padding:5px 6px;font-size:11px;background:#faf5f0;outline:none;width:72px">
          <option value="high" ${(task.priority||"medium")==="high"?"selected":""}>🔴 high</option>
          <option value="medium" ${(task.priority||"medium")==="medium"?"selected":""}>🟡 med</option>
          <option value="low" ${(task.priority||"medium")==="low"?"selected":""}>🟢 low</option>
        </select>
        <button data-tdel="${pi}-${ti}" style="background:none;border:none;cursor:pointer;color:#c0392b;font-size:15px;padding:0;flex-shrink:0">×</button>
      </div>`;
      return `<label class="task-row" style="display:flex">
        <input type="checkbox" ${checked?"checked":""} data-task="${k}" style="margin-top:2px"/>
        <span style="flex:1;font-size:13px;color:${checked?"#bbb":"#6a1010"};text-decoration:${checked?"line-through":"none"};line-height:1.5">${task.task||task}</span>
        <span class="${pillClass(task.priority||"medium")}">${task.priority||"medium"}</span>
      </label>`;
    }).join("");

    const addTaskRow = em ? `<div style="padding:8px 12px;background:#faf5f0;border-top:1px dashed #e0d0c0;display:flex;gap:6px;align-items:center">
      <span style="color:#9b2335;font-size:16px">+</span>
      <input id="tnew-task-${pi}" placeholder="New task..." style="flex:1;border:1px solid #d4c4b0;border-radius:4px;padding:6px 8px;font-size:12px;outline:none;background:white"/>
      <button data-tadd="${pi}" style="background:#9b2335;color:white;border:none;border-radius:4px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer">Add</button>
    </div>` : "";

    return `
      <div class="phase-wrap">
        <div class="phase-hd">
          <span style="font-size:17px">${phase.emoji}</span>
          <h3 style="font-size:15px;font-weight:700;color:#6a1010;flex:1">${phase.phase}</h3>
          <span style="font-size:11px;color:${pDone===phase.tasks.length?"#6b8a70":"#9b2335"};font-weight:700">${pDone}/${phase.tasks.length}</span>
        </div>
        <div class="card">${tasks}${addTaskRow}</div>
      </div>`;
  }).join("");

  const editBar = em ? `
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button id="tdone" style="background:#6b8a70;color:white;border:none;border-radius:6px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer">✓ Done Editing</button>
      <button id="treset" style="background:none;border:1px solid #c17f3e;color:#c17f3e;border-radius:6px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer">↺ Reset</button>
    </div>` :
    `<button id="tedit" style="background:none;border:1px solid #9b2335;color:#9b2335;border-radius:6px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:14px">✏️ Edit Tasks</button>`;

  return `
    <h2 class="section-title">✅ Master To-Do List</h2>
    <p class="section-sub" style="margin-bottom:10px">${em?"Edit tasks · drag to reorder · × to delete · Add new tasks per phase":"Organized by timeline. Check off as you go."}</p>
    ${editBar}
    <div style="font-size:13px;color:#9b2335;font-weight:700;margin-bottom:16px">${done} of ${total} tasks complete (${pct}%)</div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%;background:linear-gradient(90deg,#9b2335,#d4a574)"></div></div>
    ${phases}`;
}



// ─── EVENTS ───────────────────────────────────────────────────────────────────
function attachEvents() {
  // Tab nav
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click",()=>{ state.tab=btn.dataset.tab; render(); window.scrollTo(0,0); });
  });

  // Checkboxes — tasks
  document.querySelectorAll("[data-task]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      state.checkedTasks[cb.dataset.task]=cb.checked;
      scheduleSave(); updateStats();
    });
  });

  // Checkboxes — sweden
  document.querySelectorAll("[data-sweden]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      state.checkedSweden[cb.dataset.sweden]=cb.checked;
      scheduleSave(); updateStats();
    });
  });

  // Checkboxes — shopping
  document.querySelectorAll("[data-shop]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      state.checkedShop[cb.dataset.shop]=cb.checked;
      scheduleSave(); updateStats();
    });
  });

  // ── SHOPPING HANDLERS ───────────────────────────────────────────────────────
  // Checkboxes
  document.querySelectorAll("[data-shop]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      state.checkedShop[cb.dataset.shop]=cb.checked;
      scheduleSave(); updateStats();
    });
  });

  // Edit mode toggle
  document.getElementById("shop-edit")?.addEventListener("click",()=>{ state.shoppingEditMode=true; render(); });
  document.getElementById("shop-done")?.addEventListener("click",()=>{ state.shoppingEditMode=false; scheduleSave(); render(); });
  document.getElementById("shop-reset")?.addEventListener("click",()=>{
    if(confirm("Reset all shopping lists to the original items? This will remove any items you added.")) {
      state.customShoppingLists=null; state.checkedShop={}; state.shoppingEditMode=false; scheduleSave(); render();
    }
  });

  // ── LIVE INPUT HANDLERS (no re-render, direct state mutation) ────────────────
  // Shopping list edits
  liveInput("[data-shop-name]", (inp,v)=>{
    const parts=inp.dataset.shopName.split("-"); const lk=parts[0]; const idx=parseInt(parts[1]);
    const list=state.customShoppingLists?.find(l=>l.key===lk);
    if(list?.items?.[idx]) list.items[idx].name=v;
  });
  liveInput("[data-shop-qty]", (inp,v)=>{
    const parts=inp.dataset.shopQty.split("-"); const lk=parts[0]; const idx=parseInt(parts[1]);
    const list=state.customShoppingLists?.find(l=>l.key===lk);
    if(list?.items?.[idx]) list.items[idx].qty=v;
  });
  liveInput("[data-shop-price]", (inp,v)=>{
    const parts=inp.dataset.shopPrice.split("-"); const lk=parts[0]; const idx=parseInt(parts[1]);
    const list=state.customShoppingLists?.find(l=>l.key===lk);
    if(list?.items?.[idx]) list.items[idx].price=v;
  });

  // Budget edits
  liveInput("[data-bedit-item]", (inp,v)=>{
    const idx=parseInt(inp.dataset.beditItem);
    if(state.customBudget?.[idx]) {
      const old=state.customBudget[idx].item;
      if(state.actualCosts[old]!==undefined){state.actualCosts[v]=state.actualCosts[old];delete state.actualCosts[old];}
      state.customBudget[idx].item=v;
    }
  });
  liveInput("[data-bedit-amt]", (inp,v)=>{
    const idx=parseInt(inp.dataset.beditAmt);
    if(state.customBudget?.[idx]) state.customBudget[idx].budget=parseFloat(v)||0;
  });
  liveInput("[data-actual]", (inp,v)=>{
    state.actualCosts[inp.dataset.actual]=v.replace(/[^0-9.]/g,"");
  });
  liveInput("[data-extra-actual]", (inp,v)=>{
    state.extraActual[parseInt(inp.dataset.extraActual)]=v.replace(/[^0-9.]/g,"");
  });

  // Packing edits
  liveInput("[data-pack-name]", (inp,v)=>{
    const [ci,ii]=inp.dataset.packName.split("-").map(Number);
    if(state.customPacking?.[ci]?.items?.[ii]) state.customPacking[ci].items[ii].name=v;
  });

  // Night before edits
  liveInput("[data-nbc-label]", (inp,v)=>{
    const idx=parseInt(inp.dataset.nbcLabel);
    if(state.customNBCosts?.[idx]) state.customNBCosts[idx].l=v;
  });
  liveInput("[data-nbc-val]", (inp,v)=>{
    const idx=parseInt(inp.dataset.nbcVal);
    if(state.customNBCosts?.[idx]) state.customNBCosts[idx].v=v;
  });
  liveInput("[data-nbc-range]", (inp,v)=>{
    const idx=parseInt(inp.dataset.nbcRange);
    if(state.customNBCosts?.[idx]) state.customNBCosts[idx].r=v;
  });
  liveInput("[data-nb-name]", (inp,v)=>{
    const parts=inp.dataset.nbName.split("-"); const prefix=parts[0]; const idx=parseInt(parts[1]);
    if(prefix==="food"&&state.customNBFood?.[idx]) state.customNBFood[idx][0]=v;
    else if(state.customNBDrinks?.[idx]) state.customNBDrinks[idx][0]=v;
  });
  liveInput("[data-nb-price]", (inp,v)=>{
    const parts=inp.dataset.nbPrice.split("-"); const prefix=parts[0]; const idx=parseInt(parts[1]);
    if(prefix==="food"&&state.customNBFood?.[idx]) state.customNBFood[idx][1]=v;
    else if(state.customNBDrinks?.[idx]) state.customNBDrinks[idx][1]=v;
  });

  // Sweden edits
  liveInput("[data-sedit-task]", (inp,v)=>{
    const [ci,ti]=inp.dataset.seditTask.split("-").map(Number);
    if(state.customSweden?.[ci]?.tasks?.[ti]) state.customSweden[ci].tasks[ti].task=v;
  });
  liveInput("[data-sedit-tip]", (inp,v)=>{
    const [ci,ti]=inp.dataset.seditTip.split("-").map(Number);
    if(state.customSweden?.[ci]?.tasks?.[ti]) state.customSweden[ci].tasks[ti].tip=v;
  });

  // Timeline edits
  liveInput("[data-tedit]", (inp,v)=>{
    const [pi,ti]=inp.dataset.tedit.split("-").map(Number);
    if(state.customTimeline?.[pi]?.tasks?.[ti]) state.customTimeline[pi].tasks[ti].task=v;
  });

  // Schedule edits
  liveInput("[data-edit-time]", (inp,v)=>{
    const [di,ei]=inp.dataset.editTime.split("-").map(Number);
    if(state.customSchedule?.[di]?.events?.[ei]) state.customSchedule[di].events[ei].time=v;
  });
  liveInput("[data-edit-event]", (inp,v)=>{
    const [di,ei]=inp.dataset.editEvent.split("-").map(Number);
    if(state.customSchedule?.[di]?.events?.[ei]) state.customSchedule[di].events[ei].event=v;
  });

  // Delete item
  document.querySelectorAll("[data-shop-del]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const [listKey,i] = btn.dataset.shopDel.split("-"); const idx=parseInt(i);
      const list = state.customShoppingLists.find(l=>l.key===listKey);
      if(!list) return;
      list.items.splice(idx,1);
      // Rebuild checked state for this list
      const newChecked={};
      Object.entries(state.checkedShop).forEach(([k,v])=>{
        const parts=k.split("-"); const lk=parts[0]; const ki=parseInt(parts[1]);
        if(lk!==listKey) newChecked[k]=v;
        else if(ki<idx) newChecked[k]=v;
        else if(ki>idx) newChecked[`${lk}-${ki-1}`]=v;
      });
      state.checkedShop=newChecked;
      scheduleSave(); render();
    });
  });

  // Add new item to any list
  document.querySelectorAll("[data-shop-add]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const listKey = btn.dataset.shopAdd;
      const name  = (document.getElementById(`snew-name-${listKey}`)?.value||"").trim();
      const qty   = (document.getElementById(`snew-qty-${listKey}`)?.value||"").trim();
      const price = (document.getElementById(`snew-price-${listKey}`)?.value||"").trim();
      if(!name) return;
      if(!state.customShoppingLists) state.customShoppingLists=SHOPPING_LISTS.map(l=>({...l,items:l.items.map(i=>({...i}))}));
      const list = state.customShoppingLists.find(l=>l.key===listKey);
      if(list) { list.items.push({name,qty,price}); scheduleSave(); render(); }
    });
  });

  // Actual cost inputs handled by liveInput above

  // Extra item inputs
  const addExtraBtn = document.getElementById("add-extra-btn");
  if(addExtraBtn) {
    addExtraBtn.addEventListener("click",addExtraItem);
    document.getElementById("extra-item-name")?.addEventListener("keydown",e=>{ if(e.key==="Enter") addExtraItem(); });
    document.getElementById("extra-item-budget")?.addEventListener("keydown",e=>{ if(e.key==="Enter") addExtraItem(); });
  }

  // Extra actual inputs
  document.querySelectorAll("[data-extra-actual]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      state.extraActual[parseInt(inp.dataset.extraActual)]=inp.value.replace(/[^0-9.]/g,"");
      scheduleSave(); updateSummary();
    });
  });

  // Remove extra items
  document.querySelectorAll("[data-remove-extra]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i=parseInt(btn.dataset.removeExtra);
      state.extraItems.splice(i,1);
      const newEA={};
      Object.entries(state.extraActual).forEach(([k,v])=>{ const n=parseInt(k); if(n<i) newEA[k]=v; else if(n>i) newEA[n-1]=v; });
      state.extraActual=newEA;
      scheduleSave(); render();
    });
  });

  // ── SCHEDULE EDIT HANDLERS ──────────────────────────────────────────────────

  // Enter / exit edit mode
  document.getElementById("sched-edit")?.addEventListener("click",()=>{
    if (!state.customSchedule) {
      state.customSchedule = DAY_SCHEDULE.map(d=>({...d, events:d.events.map(e=>({...e}))}));
    }
    state.scheduleEditMode = true; render();
  });
  document.getElementById("sched-done")?.addEventListener("click",()=>{
    state.scheduleEditMode = false; scheduleSave(); render();
  });
  document.getElementById("sched-reset")?.addEventListener("click",()=>{
    if(confirm("Reset the schedule back to the original times? This can't be undone.")) {
      state.customSchedule = null; state.scheduleEditMode = false; scheduleSave(); render();
    }
  });

  // Schedule time/event edits handled by liveInput above

  // Delete an event row
  document.querySelectorAll("[data-del-event]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const [di,ei] = btn.dataset.delEvent.split("-").map(Number);
      state.customSchedule[di].events.splice(ei,1);
      scheduleSave(); render();
    });
  });

  // Add a new event row
  document.querySelectorAll("[data-add-event]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const di = parseInt(btn.dataset.addEvent);
      const timeVal  = (document.getElementById(`new-time-${di}`)?.value||"").trim();
      const eventVal = (document.getElementById(`new-event-${di}`)?.value||"").trim();
      if (!eventVal) return;
      state.customSchedule[di].events.push({time: timeVal||"—", event: eventVal});
      scheduleSave(); render();
    });
  });

  // Drag-to-reorder (desktop + touch)
  let dragDi=null, dragEi=null, dragEl=null, touchY=0;

  function getDragTarget(el) {
    return el.closest ? el.closest(".sched-row") : null;
  }

  // Desktop drag
  document.querySelectorAll(".sched-row").forEach(row=>{
    row.addEventListener("dragstart", e=>{
      dragDi = parseInt(row.dataset.di);
      dragEi = parseInt(row.dataset.ei);
      dragEl = row;
      row.style.opacity="0.4";
      e.dataTransfer.effectAllowed="move";
    });
    row.addEventListener("dragend", ()=>{ row.style.opacity="1"; });
    row.addEventListener("dragover", e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      row.style.borderTop="2px solid #9b2335";
    });
    row.addEventListener("dragleave", ()=>{ row.style.borderTop=""; });
    row.addEventListener("drop", e=>{
      e.preventDefault();
      row.style.borderTop="";
      const targetDi = parseInt(row.dataset.di);
      const targetEi = parseInt(row.dataset.ei);
      if (dragDi===null || dragEi===null) return;
      if (dragDi!==targetDi || dragEi===targetEi) return;
      const events = state.customSchedule[dragDi].events;
      const [moved] = events.splice(dragEi,1);
      const insertAt = targetEi > dragEi ? targetEi : targetEi;
      events.splice(insertAt,0,moved);
      dragDi=null; dragEi=null;
      scheduleSave(); render();
    });
  });

  // Touch drag (mobile)
  document.querySelectorAll(".sched-row").forEach(row=>{
    row.addEventListener("touchstart", e=>{
      dragDi = parseInt(row.dataset.di);
      dragEi = parseInt(row.dataset.ei);
      dragEl = row;
      touchY = e.touches[0].clientY;
      row.style.background="#fff8f0";
    }, {passive:true});
    row.addEventListener("touchend", e=>{
      if (dragEl) dragEl.style.background="";
      // Find element under touch point
      const touch = e.changedTouches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const target = el ? el.closest(".sched-row") : null;
      if (target && target !== row) {
        const targetDi = parseInt(target.dataset.di);
        const targetEi = parseInt(target.dataset.ei);
        if (dragDi===targetDi && dragEi!==targetEi) {
          const events = state.customSchedule[dragDi].events;
          const [moved] = events.splice(dragEi,1);
          events.splice(targetEi,0,moved);
          scheduleSave(); render();
        }
      }
      dragDi=null; dragEi=null; dragEl=null;
    }, {passive:true});
  });

  // ── BUDGET EDIT HANDLERS ────────────────────────────────────────────────────
  document.getElementById("bedit")?.addEventListener("click",()=>{ state.budgetEditMode=true; render(); });
  document.getElementById("bdone")?.addEventListener("click",()=>{ state.budgetEditMode=false; scheduleSave(); render(); });
  document.getElementById("breset")?.addEventListener("click",()=>{
    if(confirm("Reset budget to original items?")) { state.customBudget=null; state.budgetEditMode=false; scheduleSave(); render(); }
  });

  // Budget inline edits
  document.querySelectorAll("[data-bedit-item]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const idx=parseInt(inp.dataset.beditItem);
      const oldName = state.customBudget[idx].item;
      state.customBudget[idx].item = inp.value;
      // migrate actual cost key
      if(state.actualCosts[oldName]!==undefined){ state.actualCosts[inp.value]=state.actualCosts[oldName]; delete state.actualCosts[oldName]; }
      scheduleSave();
    });
  });
  document.querySelectorAll("[data-bedit-amt]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const idx=parseInt(inp.dataset.beditAmt);
      state.customBudget[idx].budget=parseFloat(inp.value.replace(/[^0-9.]/g,""))||0;
      scheduleSave(); render();
    });
  });
  document.querySelectorAll("[data-cycleb]").forEach(el=>{
    el.addEventListener("click",()=>{
      const idx=parseInt(el.dataset.cycleb);
      const cycle=["ok","warning","note"];
      const cur=state.customBudget[idx].status||"ok";
      state.customBudget[idx].status=cycle[(cycle.indexOf(cur)+1)%3];
      scheduleSave(); render();
    });
  });
  document.querySelectorAll("[data-bdel]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const idx=parseInt(btn.dataset.bdel);
      state.customBudget.splice(idx,1);
      scheduleSave(); render();
    });
  });

  // Budget drag reorder
  let bDragIdx=null;
  document.querySelectorAll("[data-bidx]").forEach(row=>{
    row.addEventListener("dragstart",e=>{ bDragIdx=parseInt(row.dataset.bidx); row.style.opacity=".4"; e.dataTransfer.effectAllowed="move"; });
    row.addEventListener("dragend",()=>{ row.style.opacity="1"; });
    row.addEventListener("dragover",e=>{ e.preventDefault(); row.style.borderTop="2px solid #9b2335"; });
    row.addEventListener("dragleave",()=>{ row.style.borderTop=""; });
    row.addEventListener("drop",e=>{
      e.preventDefault(); row.style.borderTop="";
      const targetIdx=parseInt(row.dataset.bidx);
      if(bDragIdx===null||bDragIdx===targetIdx) return;
      const [moved]=state.customBudget.splice(bDragIdx,1);
      state.customBudget.splice(targetIdx,0,moved);
      bDragIdx=null; scheduleSave(); render();
    });
  });

  // Budget add new item
  document.getElementById("bnew-add")?.addEventListener("click",()=>{
    const name=(document.getElementById("bnew-name")?.value||"").trim();
    const amt=parseFloat((document.getElementById("bnew-amt")?.value||"").replace(/[^0-9.]/g,""))||0;
    if(!name) return;
    if(!state.customBudget) state.customBudget=BUDGET_LINES.map(r=>({...r}));
    state.customBudget.push({item:name,budget:amt,low:0,high:0,notes:"Custom item",status:"ok"});
    scheduleSave(); render();
  });

  // ── SWEDEN EDIT HANDLERS ────────────────────────────────────────────────────
  document.getElementById("swedit")?.addEventListener("click",()=>{ state.swedenEditMode=true; render(); });
  document.getElementById("swdone")?.addEventListener("click",()=>{ state.swedenEditMode=false; scheduleSave(); render(); });
  document.getElementById("swreset")?.addEventListener("click",()=>{
    if(confirm("Reset Sweden tasks to original?")) { state.customSweden=null; state.swedenEditMode=false; scheduleSave(); render(); }
  });
  document.querySelectorAll("[data-sedit-task]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const [ci,ti]=inp.dataset.seditTask.split("-").map(Number);
      state.customSweden[ci].tasks[ti].task=inp.value; scheduleSave();
    });
  });
  document.querySelectorAll("[data-sedit-tip]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const [ci,ti]=inp.dataset.seditTip.split("-").map(Number);
      state.customSweden[ci].tasks[ti].tip=inp.value; scheduleSave();
    });
  });
  document.querySelectorAll("[data-sdel]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const [ci,ti]=btn.dataset.sdel.split("-").map(Number);
      state.customSweden[ci].tasks.splice(ti,1); scheduleSave(); render();
    });
  });
  document.querySelectorAll("[data-sadd]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const ci=parseInt(btn.dataset.sadd);
      const val=(document.getElementById(`snew-task-${ci}`)?.value||"").trim();

      state.customSweden[ci].tasks.push({task:val,tip:""});

    });
  });

  // ── TIMELINE EDIT HANDLERS ───────────────────────────────────────────────────
  document.getElementById("tedit")?.addEventListener("click",()=>{ state.timelineEditMode=true; render(); });
  document.getElementById("tdone")?.addEventListener("click",()=>{ state.timelineEditMode=false; scheduleSave(); render(); });
  document.getElementById("treset")?.addEventListener("click",()=>{
    if(confirm("Reset to-do list to original tasks?")) { state.customTimeline=null; state.timelineEditMode=false; scheduleSave(); render(); }
  });
  document.querySelectorAll("[data-tedit]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const [pi,ti]=inp.dataset.tedit.split("-").map(Number);
      state.customTimeline[pi].tasks[ti].task=inp.value; scheduleSave();
    });
  });
  document.querySelectorAll("[data-tpriority]").forEach(sel=>{
    sel.addEventListener("change",()=>{
      const [pi,ti]=sel.dataset.tpriority.split("-").map(Number);
      state.customTimeline[pi].tasks[ti].priority=sel.value; scheduleSave();
    });
  });
  document.querySelectorAll("[data-tdel]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const [pi,ti]=btn.dataset.tdel.split("-").map(Number);
      state.customTimeline[pi].tasks.splice(ti,1); scheduleSave(); render();
    });
  });
  document.querySelectorAll("[data-tadd]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const pi=parseInt(btn.dataset.tadd);
      const val=(document.getElementById(`tnew-task-${pi}`)?.value||"").trim();
      if(!val) return;
      state.customTimeline[pi].tasks.push({task:val,priority:"medium"});
      scheduleSave(); render();
    });
  });

  // ── PACKING HANDLERS ────────────────────────────────────────────────────────
  document.getElementById("pack-edit")?.addEventListener("click",()=>{ state.packingEditMode=true; render(); });
  document.getElementById("pack-done")?.addEventListener("click",()=>{ state.packingEditMode=false; scheduleSave(); render(); });
  document.getElementById("pack-reset")?.addEventListener("click",()=>{
    if(confirm("Reset packing list to defaults? Your custom items will be removed.")) {
      state.customPacking=null; state.packingEditMode=false; scheduleSave(); render();
    }
  });

  // Check/uncheck packing items
  document.querySelectorAll("[data-pack-check]").forEach(cb=>{
    cb.addEventListener("change",()=>{
      const [ci,ii] = cb.dataset.packCheck.split("-").map(Number);
      if (!state.customPacking) state.customPacking = DEFAULT_PACKING.map(cat=>({...cat,items:cat.items.map(i=>({...i}))}));
      state.customPacking[ci].items[ii].checked = cb.checked;
      scheduleSave(); render();
    });
  });

  // Edit item name — handled by liveInput above


  // Delete item
  document.querySelectorAll("[data-pack-del]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const [ci,ii] = btn.dataset.packDel.split("-").map(Number);
      state.customPacking[ci].items.splice(ii,1);
      scheduleSave(); render();
    });
  });

  // Add new item to category
  document.querySelectorAll("[data-pack-add]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const ci = parseInt(btn.dataset.packAdd);
      const val = (document.getElementById(`pack-new-${ci}`)?.value||"").trim();
      if(!val) return;
      if(!state.customPacking) state.customPacking = DEFAULT_PACKING.map(cat=>({...cat,items:cat.items.map(i=>({...i}))}));
      state.customPacking[ci].items.push({name:val, checked:false});
      scheduleSave(); render();
    });
  });

  // Also allow Enter key on add inputs
  state.customPacking?.forEach((_,ci)=>{
    const inp = document.getElementById(`pack-new-${ci}`);
    inp?.addEventListener("keydown", e=>{
      if(e.key==="Enter") document.querySelector(`[data-pack-add="${ci}"]`)?.click();
    });
  });

  // ── NIGHT BEFORE EDIT HANDLERS ──────────────────────────────────────────────
  document.getElementById("nb-done")?.addEventListener("click",()=>{ state.nbEditMode=false; scheduleSave(); render(); });
  document.getElementById("nb-reset")?.addEventListener("click",()=>{
    if(confirm("Reset Night Before to original?")) { state.customNBCosts=null; state.customNBFood=null; state.customNBDrinks=null; state.nbEditMode=false; scheduleSave(); render(); }
  });

  // Cost card edits
  document.querySelectorAll("[data-nbc-label]").forEach(inp=>{
    inp.addEventListener("change",()=>{ state.customNBCosts[parseInt(inp.dataset.nbcLabel)].l=inp.value; scheduleSave(); });
  });
  document.querySelectorAll("[data-nbc-val]").forEach(inp=>{
    inp.addEventListener("change",()=>{ state.customNBCosts[parseInt(inp.dataset.nbcVal)].v=inp.value; scheduleSave(); render(); });
  });
  document.querySelectorAll("[data-nbc-range]").forEach(inp=>{
    inp.addEventListener("change",()=>{ state.customNBCosts[parseInt(inp.dataset.nbcRange)].r=inp.value; scheduleSave(); });
  });
  document.querySelectorAll("[data-nbc-del]").forEach(btn=>{
    btn.addEventListener("click",()=>{ state.customNBCosts.splice(parseInt(btn.dataset.nbcDel),1); scheduleSave(); render(); });
  });
  document.getElementById("nbc-add")?.addEventListener("click",()=>{
    const l=(document.getElementById("nbc-new-label")?.value||"").trim();
    const v=(document.getElementById("nbc-new-val")?.value||"").trim()||"$0";
    if(!l) return;
    state.customNBCosts.push({l,v,r:"",w:false});
    scheduleSave(); render();
  });

  // Food/drinks list edits
  document.querySelectorAll("[data-nb-name]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const [prefix,i]=inp.dataset.nbName.split("-"); const idx=parseInt(i);
      if(prefix==="food") state.customNBFood[idx][0]=inp.value;
      else state.customNBDrinks[idx][0]=inp.value;
      scheduleSave();
    });
  });
  document.querySelectorAll("[data-nb-price]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const [prefix,i]=inp.dataset.nbPrice.split("-"); const idx=parseInt(i);
      if(prefix==="food") state.customNBFood[idx][1]=inp.value;
      else state.customNBDrinks[idx][1]=inp.value;
      scheduleSave();
    });
  });
  document.querySelectorAll("[data-nb-del]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const [prefix,i]=btn.dataset.nbDel.split("-"); const idx=parseInt(i);
      if(prefix==="food") state.customNBFood.splice(idx,1);
      else state.customNBDrinks.splice(idx,1);
      scheduleSave(); render();
    });
  });
  document.querySelectorAll("[data-nb-add]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const prefix=btn.dataset.nbAdd;
      const name=(document.getElementById(`nb-new-name-${prefix}`)?.value||"").trim();
      const price=(document.getElementById(`nb-new-price-${prefix}`)?.value||"").trim()||"";
      if(!name) return;
      if(prefix==="food") state.customNBFood.push([name,price]);
      else state.customNBDrinks.push([name,price]);
      scheduleSave(); render();
    });
  });
}


function addExtraItem() {
  const name   = (document.getElementById("extra-item-name")?.value||"").trim();
  const budget = parseFloat((document.getElementById("extra-item-budget")?.value||"").replace(/[^0-9.]/g,""))||0;
  const status = document.getElementById("extra-item-status")?.value||"ok";
  if(!name) return;
  state.extraItems.push({item:name,budget,low:0,high:0,notes:"Custom item",status});
  state.newExtra={item:"",budget:"",status:"ok"};
  scheduleSave(); render();
}

// Load from localStorage instantly — no cloud sync needed
try {
  const saved = localStorage.getItem(SYNC_KEY);
  if (saved) {
    const d = JSON.parse(saved);
    state.checkedTasks        = d.checkedTasks        || {};
    state.checkedSweden       = d.checkedSweden       || {};
    state.checkedShop         = d.checkedShop         || {};
    state.shopCustom          = d.shopCustom          || { fri_food:[], fri_drinks:[], breakfast:[], wed_drinks:[], fire:[] };
    state.actualCosts         = d.actualCosts         || {};
    state.extraItems          = d.extraItems          || [];
    state.extraActual         = d.extraActual         || {};
    state.customSchedule      = d.customSchedule      || null;
    state.customBudget        = d.customBudget        || null;
    state.customTimeline      = d.customTimeline      || null;
    state.customSweden        = d.customSweden        || null;
    state.customShoppingLists = d.customShoppingLists || null;
    state.customNBCosts       = d.customNBCosts       || null;
    state.customNBFood        = d.customNBFood        || null;
    state.customNBDrinks      = d.customNBDrinks      || null;
    state.customPacking       = d.customPacking       || null;
    state.lastSaved           = d.savedAt             || null;
  }
} catch(e) {}
state.syncStatus = "synced";

// Save to localStorage on every change
saveToCloud = async function() {
  try {
    const payload = {
      checkedTasks:        state.checkedTasks,
      checkedSweden:       state.checkedSweden,
      checkedShop:         state.checkedShop,
      shopCustom:          state.shopCustom,
      actualCosts:         state.actualCosts,
      extraItems:          state.extraItems,
      extraActual:         state.extraActual,
      customSchedule:      state.customSchedule      || null,
      customBudget:        state.customBudget        || null,
      customTimeline:      state.customTimeline      || null,
      customSweden:        state.customSweden        || null,
      customShoppingLists: state.customShoppingLists || null,
      customNBCosts:       state.customNBCosts       || null,
      customNBFood:        state.customNBFood        || null,
      customNBDrinks:      state.customNBDrinks      || null,
      customPacking:       state.customPacking       || null,
      savedAt:             new Date().toISOString(),
    };
    localStorage.setItem(SYNC_KEY, JSON.stringify(payload));
    state.syncStatus = "synced";
    state.lastSaved  = payload.savedAt;
  } catch(e) { state.syncStatus = "error"; }
  renderSyncBadge();
};
